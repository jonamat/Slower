server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    gzip              on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_types        text/css text/plain application/javascript application/json
                      application/xml image/svg+xml;

    # assets carry a hash in the name: they can be cached forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # the worklet has no hash: it must be re-read on every deploy
    location = /stretch-processor.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location ~ ^/(robots\.txt|sitemap\.xml)$ {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
